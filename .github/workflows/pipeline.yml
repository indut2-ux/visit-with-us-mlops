
name: Visit With Us MLOps Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - "tourism_project/deployment/best_model.pkl"

  workflow_dispatch:

permissions:
  contents: write


jobs:

  # ======================================================
  # JOB 1 - DATA VALIDATION
  # ======================================================

  data-validation:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Validate dataset
        run: |
          python tourism_project/data/validate_data.py


  # ======================================================
  # JOB 2 - DATA PREPARATION
  # ======================================================

  data-preparation:

    needs: data-validation

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install preparation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn

      - name: Run data preparation
        run: |
          python tourism_project/model_building/prep.py

      - name: Upload prepared data artifact
        uses: actions/upload-artifact@v4
        with:
          name: prepared-data
          path: |
            tourism_project/model_building/train.csv
            tourism_project/model_building/test.csv


  # ======================================================
  # JOB 3 - MODEL TRAINING
  # ======================================================

  model-training:

    needs: data-preparation

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn joblib mlflow

      - name: Download prepared data artifact
        uses: actions/download-artifact@v4
        with:
          name: prepared-data
          path: tourism_project/model_building

      - name: Train and evaluate model
        run: |
          python tourism_project/model_building/train.py

      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: tourism_project/deployment/best_model.pkl


  # ======================================================
  # JOB 4 - COMMIT MODEL TO MAIN
  # ======================================================

  commit-model:

    needs: model-training

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: tourism_project/deployment

      - name: Commit updated model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tourism_project/deployment/best_model.pkl

          if git diff --cached --quiet; then
            echo "No model changes to commit."
          else
            git commit -m "Update trained model [skip ci]"
            git push origin main
          fi
